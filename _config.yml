title: 나의 학습 노트 
# 헤더와 사이드바에 표시되는 블로그 이름 (브라우저 탭 제목은 title 을 사용)
brand: "Learning Notes"
# 방명록 (Giscus · GitHub Discussions).
# https://giscus.app 에서 저장소와 카테고리를 고르면 아래 값이 표시된다. 그대로 복사해 넣는다.
#   repo        : data-repo         (예: 사용자명/저장소명)
#   repo_id     : data-repo-id
#   category    : data-category
#   category_id : data-category-id
# 토큰은 필요 없다. 네 값 중 하나라도 비어 있으면 방명록 페이지에 "준비 중" 안내가 표시된다.
# term 은 방명록이 연결될 Discussion 제목이다. 모든 방명록 글이 이 Discussion 하나에 모인다.
giscus:
  repo: "eunjung01230/my-blog"
  repo_id: "R_kgDOUGl-1Q"
  category: "Guestbook"
  category_id: "DIC_kwDOUGl-1c4DGMyz"
  term: "Guestbook"
remote_theme: daattali/beautiful-jekyll@6.0.1
baseurl: "/my-blog"
site-css:
  - "/assets/css/custom.css"

# 프로젝트 글 전용 저장소.
# 일반 학습 글(_posts)과 파일 위치를 분리하되, 블로그에서는 함께 다룬다.
collections:
  project_posts:
    output: true
    permalink: /projects/:path/

defaults:
  - scope:
      path: ""
      type: project_posts
    values:
      layout: post
      # category 는 사이드바의 Project 카테고리와 연결되는 값이다.
      # categories 는 일반 글과 같은 키로 걸러내기 위해 함께 채워 둔다.
      category: project
      categories:
        - project
# 사이트로 내보내지 않을 파일. (exclude 를 지정하면 Jekyll 기본 제외 목록을 덮어쓰므로 Gemfile 등도 함께 적는다)
#   CLAUDE.md        : AI 작업 지시서
#   markdown-test.md : 마크다운 연습 파일
exclude:
  - CLAUDE.md
  - markdown-test.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

# 새 글 쓰기 페이지(/write/). 메뉴에는 없고 주소로만 들어간다.
# 저장 버튼은 이 저장소·브랜치의 GitHub 새 파일 화면을 연다. (커밋은 저장소 쓰기 권한이 있어야 가능)
write:
  repo: "eunjung01230/my-blog"
  branch: main
