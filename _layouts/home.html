---
layout: default
---

<section class="intro">

  <p class="intro-text">
    개발하면서 헷갈렸던 개념과<br>
    직접 해결한 문제를 기록합니다.
  </p>

  <a class="intro-link" href="{{ '/posts/' | relative_url }}">전체 글 보기</a>

</section>


<section class="post-list-section">

  <h2 class="section-title">최근 기록</h2>

  <div class="post-list">
    {%- for post in site.posts limit: 5 -%}
      {% include post-card.html post=post %}
    {%- endfor -%}
  </div>

  {%- if site.posts.size > 5 -%}
  <p class="section-more">
    <a href="{{ '/posts/' | relative_url }}">전체 글 보기 &rarr;</a>
  </p>
  {%- endif -%}

</section>
