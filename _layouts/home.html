---
layout: default
---

<section class="intro">

  <p class="intro-label">Learning Log</p>

  <h1 class="intro-headline">
    배우고, 막히고,<br>
    해결한 과정을 남깁니다.
  </h1>

  <p class="intro-sub">
    헷갈렸던 개념과 직접 해결한 문제를<br>
    다시 찾기 쉽게 정리합니다.
  </p>

  <a class="intro-link" href="{{ '/posts/' | relative_url }}">전체 글 보기 &rarr;</a>

</section>


<section class="post-list-section">

  <h2 class="section-title">최근 기록</h2>

  <div class="post-list">
    {%- for post in site.posts limit: 5 -%}
      {% include post-card.html post=post %}
    {%- endfor -%}
  </div>

  {%- if site.posts.size > 5 -%}
  <p class="section-more">
    <a href="{{ '/posts/' | relative_url }}">전체 글 보기 &rarr;</a>
  </p>
  {%- endif -%}

</section>
