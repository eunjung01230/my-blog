{%- comment -%}
  저장 코드 입력 창. 글쓰기(/write/)와 프로필 사진 편집(/profile/edit/)이 함께 쓴다.
  동작은 assets/js/save-gate.js. 이 include 를 페이지 전용 스크립트보다 먼저 둔다. (defer 는 순서대로 실행)
{%- endcomment %}
<dialog class="write-gate" data-save-gate data-code-hash="{{ site.write.code_hash | escape }}" aria-labelledby="save-gate-title">
  <form method="dialog" data-save-gate-form>
    <h2 class="write-gate-title" id="save-gate-title">저장 코드 입력</h2>
    <p class="write-hint">블로그 주인만 저장할 수 있어요. 코드를 모르면 취소를 누르세요. 작업한 내용은 그대로 남습니다.</p>
    <input type="password" autocomplete="current-password" aria-label="저장 코드" data-save-gate-input>
    <p class="write-gate-error" data-save-gate-error hidden>코드가 맞지 않습니다.</p>
    <label class="write-gate-remember">
      <input type="checkbox" data-save-gate-remember> 이 브라우저에서 기억하기
    </label>
    <div class="write-actions">
      <button type="submit" class="write-button write-button-primary">확인</button>
      <button type="button" class="write-button" data-save-gate-cancel>취소</button>
    </div>
  </form>
</dialog>

<script src="{{ '/assets/js/save-gate.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
