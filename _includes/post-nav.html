<nav class="post-navigation">

  <div class="prev-post">

    {% if page.previous %}

    <a href="{{ page.previous.url | relative_url }}">
      ← {{ page.previous.title }}
    </a>

    {% endif %}

  </div>


  <div class="next-post">

    {% if page.next %}

    <a href="{{ page.next.url | relative_url }}">
      {{ page.next.title }} →
    </a>

    {% endif %}

  </div>

</nav>
