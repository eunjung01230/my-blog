{%- assign brand = site.brand | default: site.title -%}
<header class="site-header">

  <div class="site-header-inner">

    <div class="site-header-start">

      <button type="button" class="icon-button sidebar-open-button"
              data-sidebar-toggle aria-controls="sidebar" aria-expanded="true"
              aria-label="카테고리 펼치기">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16"/>
        </svg>
      </button>

      <a class="site-title" href="{{ '/' | relative_url }}">{{ brand }}</a>

    </div>

    <nav class="site-nav" aria-label="주요 메뉴">
      <a href="{{ '/posts/' | relative_url }}"{% if page.url == '/posts/' %} class="is-active"{% endif %}>Posts</a>
      <a href="{{ '/projects/' | relative_url }}"{% if page.url == '/projects/' %} class="is-active"{% endif %}>Projects</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} class="is-active"{% endif %}>About</a>
    </nav>

  </div>

</header>
